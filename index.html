<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AF BoardDocs</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    h1 { font-size: 1.2rem; margin-bottom: 1rem; }
    table, #agendaTable { font-size: 0.95rem; }
    canvas {
      height: 100% !important;
      max-width: 100%;
      display: block;
      margin: 2rem auto;
    }
    .truncate-cell, .attachments-cell {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
      cursor: pointer;
      transition: all 0.15s;
    }
    tr.expanded .truncate-cell,
    tr.expanded .attachments-cell {
      white-space: normal !important;
      overflow: visible !important;
      text-overflow: initial !important;
      max-width: 600px !important;
      word-break: break-word;
      background: #f8f8f8;
      z-index: 2;
      position: relative;
    }
    tr.expanded { background: #fafafa !important; }
    .attachments-cell { color: #0073b1; text-decoration: underline; }
    .attachments-list { display: none; margin: 0.4em 0 0 0; padding: 0; }
    tr.expanded .attachments-list { display: block; }

    /* Header Filter Dropdowns */
    th { position: relative; }
    .filter-btn {
  display: inline-block;
  cursor: pointer;
  font-size: 1.18em;
  margin-left: 0.7em;
  padding: 1px 7px 1px 7px;
  border-radius: 5px;
  background: #eef5fb;
  border: 1px solid #b5cde7;
  color: #2576b6;
  box-shadow: 0 1px 3px rgba(80,120,200,0.06);
  transition: background 0.15s, border 0.12s;
  vertical-align: middle;
  position: relative;
}
.filter-btn:hover, .filter-btn:focus {
  background: #d4eafd;
  border: 1.5px solid #2587d2;
  outline: none;
}

.filter-btn:active {
  background: #b2d6f8;
}

   
    .header-filter {
      display: none;
      position: absolute;
      background: #fff;
      border: 1px solid #ccc;
      padding: 8px 12px;
      z-index: 20;
      max-height: 220px;
      overflow-y: auto;
      min-width: 140px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      left: 0;
      top: 100%;
    }
    .header-filter label { display: block; margin: 0 0 2px 0; font-weight: normal; cursor: pointer; }
    .header-filter input[type=checkbox] { margin-right: 4px; }
    .header-filter button.select-all-btn {
      background: #f5f5f5;
      border: 1px solid #ccc;
      font-size: 0.95em;
      padding: 2px 8px;
      margin-bottom: 5px;
      cursor: pointer;
      display: block;
      width: 100%;
      text-align: left;
    }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>
  <script>
    fetch("nav.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("nav-placeholder").innerHTML = data;
      });
  </script>

  <h1>Homepage</h1>
  <script>
    document.title = document.querySelector("h1")?.innerText || "AF BoardDocs Dash";
  </script>

  <table id="agendaTable" class="display" width="100%">
    <thead>
      <tr>
        <th>
          Year <span class="filter-btn" data-col="0">🔽</span>
          <div class="header-filter" data-col="0"></div>
        </th>
        <th>Date</th>
        <th>Agenda #</th>
        <th>Title</th>
        <th>
          Category <span class="filter-btn" data-col="4">🔽</span>
          <div class="header-filter" data-col="4"></div>
        </th>
        <th>Type</th>
        <th>Recommended Action</th>
        <th>Moved By</th>
        <th>Seconded By</th>
        <th>Vote Result</th>
        <th>Yes</th>
        <th>No</th>
        <th>Abstain</th>
        <th>Attachments</th>
      </tr>
    </thead>
  </table>

  <canvas id="voteChart"></canvas>

<script>
const chunkedFiles = [
  "data/master_2013to2024_cleaned.json",
  "data/2025_cleaned.json"
];

// --- CATEGORY NORMALIZATION ---
function normalizeCategories(cat) {
  if (!cat) return ["Other"];
  cat = cat.replace(/^\d+\.*\s*-*\s*/g, '').toLowerCase().trim();
  const map = [
    { tag: "Call to Order", regex: /call to order/ },
    { tag: "Pledge of Allegiance", regex: /pledge of allegiance/ },
    { tag: "Information", regex: /information|discussion|presentation|informational/ },
    { tag: "Recognition/Celebration", regex: /recognition|recognize|celebration|presentations? and celebrations?/ },
    { tag: "Call to the Public", regex: /call to the public|public comments?/ },
    { tag: "Approval of Minutes", regex: /approval of minutes|meeting minutes|minutes/ },
    { tag: "Action Items", regex: /action items?/ },
    { tag: "Consent Agenda Items", regex: /consent agenda/ },
    { tag: "Future Agenda Items", regex: /future agenda/ },
    { tag: "Return to Regular Session", regex: /return to regular session|reconvene|resturn to regular session|reconvene regular board meeting|reconvene meeting|reconvene the regular board meeting|reconvene to regular session/ },
    { tag: "Adjournment", regex: /adjourn(ment)?|adjourn excutive session|adjourn exutive session|adjourn excutiv(e)? session/ },
    { tag: "Executive Session", regex: /executive session|executive sesssion|excutive session|exective session/ },
    { tag: "Public Hearing", regex: /public hearing/ },
    { tag: "Recognitions", regex: /recognitions?/ },
    { tag: "Oath of Office/Election of Governing Board Officers", regex: /oath of office|election of governing board officers|nomination|nominations and election|election of governing board officers for/ },
    { tag: "Board Advisory Committee", regex: /advisory committee/ }
  ];
  const tags = [];
  for (let m of map) {
    if (cat.match(m.regex)) tags.push(m.tag);
  }
  if (tags.length === 0) tags.push("Other");
  return [...new Set(tags)];
}

// --- UTIL: Get Unique Values for a DataTable Column ---
function getColumnUnique(table, colIdx) {
  return [...new Set(table.column(colIdx).data().toArray().flatMap(x =>
    Array.isArray(x) ? x : (x || '').toString().split(/,\s*/)
  ))].filter(Boolean).sort();
}

// --- CHART ---
function updateChart(data) {
  const result = { Yes: 0, No: 0, Abstain: 0 };
  data.forEach(row => {
    result.Yes += Number(row.yes_votes) || 0;
    result.No += Number(row.no_votes) || 0;
    result.Abstain += Number(row.abstain_votes) || 0;
  });
  const ctx = document.getElementById('voteChart').getContext('2d');
  if (window.voteChart) window.voteChart.destroy();
  window.voteChart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: Object.keys(result),
      datasets: [{
        label: 'Total Votes',
        data: Object.values(result),
        backgroundColor: ['#2ecc71', '#e74c3c', '#f1c40f']
      }]
    },
    options: {
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        title: { display: true, text: "Vote Totals (Visible Items)" }
      }
    }
  });
}

let allAgendaItems = [];
let table; // global for filters

// --- Maintain selected filter values for each column ---
let activeFilterValues = { 0: null, 4: null }; // Column 0 (Year), 4 (Category)

(async function(){
  // --- 1. Load and flatten data ---
  const meetings = [];
  for (let file of chunkedFiles) {
    try {
      const resp = await fetch(file);
      const json = await resp.json();
      meetings.push(...json);
    } catch (e) {
      console.error("Failed to load", file, e);
    }
  }
  const items = [];
  meetings.forEach(meeting => {
    (meeting.agenda_items || []).forEach(item => {
      let yes = 0, no = 0, abstain = 0;
      let moved_by = "", seconded_by = "";
      let vote_result = "";
      if (item.motion_and_voting) {
        const mv = item.motion_and_voting;
        vote_result = mv.vote_result || "";
        moved_by = mv.moved_by || "";
        seconded_by = mv.seconded_by || "";
        if (Array.isArray(mv.votes)) {
          mv.votes.forEach(v => {
            if (!v || !v.vote) return;
            if (v.vote === "Yes") yes++;
            else if (v.vote === "No") no++;
            else if (v.vote === "Abstain") abstain++;
          });
        }
      }
      let attachmentArray = [];
      if (Array.isArray(item.attachments) && item.attachments.length) {
        attachmentArray = item.attachments.map(a =>
          `<a href="${a.url}" target="_blank">${a.filename || a.label || "File"}</a>`
        );
      }
      const normCats = normalizeCategories(item.category);
      items.push({
        year: (meeting.meeting_date || "").slice(0, 4),
        meeting_date: meeting.meeting_date,
        agenda_number: item.number,
        title: item.title,
        category: normCats,
        type: item.type,
        recommended_action: item.recommendedAction,
        moved_by: moved_by,
        seconded_by: seconded_by,
        vote_result: vote_result,
        yes_votes: yes,
        no_votes: no,
        abstain_votes: abstain,
        attachment_links: attachmentArray
      });
    });
  });
  allAgendaItems = items;

  // --- 2. DataTables Setup ---
  table = $('#agendaTable').DataTable({
    data: allAgendaItems,
    order: [[0, 'desc']],
    columns: [
      { data: "year" },
      { data: "meeting_date" },
      { data: "agenda_number" },
      { data: "title" },
      {
        data: "category",
        render: cats => Array.isArray(cats) ? cats.join(", ") : cats
      },
      { data: "type" },
      {
        data: "recommended_action",
        render: function (data, type, row, meta) {
          if (!data) return "";
          if (type === 'display') {
            return `<div class="truncate-cell" title="Click row to expand/collapse">${data}</div>`;
          }
          return data;
        }
      },
      { data: "moved_by" },
      { data: "seconded_by" },
      { data: "vote_result" },
      { data: "yes_votes" },
      { data: "no_votes" },
      { data: "abstain_votes" },
      {
        data: "attachment_links",
        orderable: false,
        render: function (data, type, row, meta) {
          if (!data || !data.length) return "";
          if (type === 'display') {
            return `<div class="attachments-cell" title="Click row to expand/collapse">Show Attachments <span style="font-size:1em">📎</span>
              <div class="attachments-list">${data.map(a => `<div>${a}</div>`).join("")}</div>
            </div>`;
          }
          return data.length + " attachment" + (data.length === 1 ? "" : "s");
        }
      }
    ]
  });

  // --- 3. DataTables Column Filtering ---
  // Register custom filter (once)
  $.fn.dataTable.ext.search.push(function(settings, data, dataIndex) {
    // Only filter if values are selected (null = show all)
    for (let colIdx of [0,4]) {
      const filterVals = activeFilterValues[colIdx];
      if (Array.isArray(filterVals) && filterVals.length) {
        // Get data value for that row
        let rowVal = table.row(dataIndex).data();
        if (!rowVal) return true;
        let colVal = rowVal[colIdx === 0 ? 'year' : 'category'];
        let valArr = Array.isArray(colVal) ? colVal : [colVal];
        // Must match at least one checked value
        if (!valArr.some(v => filterVals.includes(v))) return false;
      }
    }
    return true;
  });

  // --- 4. Build filter dropdowns on click, with current state ---
  $('#agendaTable thead').on('click', '.filter-btn', function(e) {
    e.stopPropagation();
     e.preventDefault();
    const colIdx = $(this).data('col');
    const $filterDiv = $(`.header-filter[data-col=${colIdx}]`);
    $('.header-filter').not($filterDiv).hide(); // close others

    const vals = getColumnUnique(table, colIdx);

    // Use current activeFilterValues for checked/unchecked state
    let checkedValues = Array.isArray(activeFilterValues[colIdx]) ? activeFilterValues[colIdx] : vals;

    $filterDiv.empty();
    $filterDiv.append('<button type="button" class="select-all-btn">Select All</button>');
    vals.forEach(v => {
      const checked = checkedValues.includes(v) ? 'checked' : '';
      $filterDiv.append(
        `<label><input type="checkbox" value="${v}" ${checked}> ${v}</label>`
      );
    });
    $filterDiv.toggle();
  });

  // --- 5. Only close filter if you click outside ---
  $(document).on('mousedown', function(e) {
    if (!$(e.target).closest('.header-filter, .filter-btn').length) {
      $('.header-filter').hide();
    }
  });

  // --- 6. "Select All" button logic ---
  $('#agendaTable thead').on('click', '.select-all-btn', function(e) {
    e.stopPropagation();
    $(this).parent().find('input[type=checkbox]').prop('checked', true).trigger('change');
  });

  // --- 7. Handle checkbox changes and update DataTables filter ---
  $('#agendaTable thead').on('change', '.header-filter input[type=checkbox]', function(e) {
    e.stopPropagation();
    const $filterDiv = $(this).closest('.header-filter');
    const colIdx = parseInt($filterDiv.data('col'));
    const checked = $filterDiv.find('input[type=checkbox]:checked').map(function() {
      return this.value;
    }).get();
    activeFilterValues[colIdx] = checked.length === getColumnUnique(table, colIdx).length ? null : checked;
    table.draw();
    updateChart(table.rows({ filter: 'applied' }).data().toArray());
  });

  // --- 8. On DataTables redraw, keep filter state and close dropdowns ---
  table.on('draw', function() {
    $('.header-filter').hide();
    updateChart(table.rows({ filter: 'applied' }).data().toArray());
    $('#agendaTable tbody tr').removeClass('expanded');
  });

  // --- Expand/collapse logic ---
  $('#agendaTable tbody').on('click', 'td', function () {
    var $tr = $(this).closest('tr');
    $tr.toggleClass('expanded');
  });

  // --- Initial chart ---
  updateChart(table.rows({ filter: 'applied' }).data().toArray());

})();
</script>

</body>
</html>
