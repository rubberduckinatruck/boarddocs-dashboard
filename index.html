<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AF BoardDocs</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    h1 { font-size: 1.2rem; margin-bottom: 1rem; }
    .filter-bar {
      display: flex;
      flex-direction: row;
      gap: 2em;
      align-items: flex-start;
      background: #f8fafd;
      border-radius: 10px;
      border: 1px solid #e2e9f5;
      padding: 1em 1.2em 0.8em 1.2em;
      margin-bottom: 1.7em;
      box-shadow: 0 2px 12px rgba(60,120,200,0.04);
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      min-width: 160px;
      max-height: 250px;
      margin-right: 0.5em;
    }
    .filter-label {
      font-weight: bold;
      margin-bottom: 0.5em;
      font-size: 1.03em;
    }
    .filter-btn-row {
      display: flex;
      gap: 0.7em;
      margin-bottom: 0.3em;
    }
    .select-all-btn, .clear-all-btn {
      font-size: 0.97em;
      border-radius: 5px;
      padding: 2px 10px;
      cursor: pointer;
      width: fit-content;
      align-self: flex-start;
      border: 1px solid #b5cde7;
      background: #eef5fb;
      color: #2576b6;
      transition: background 0.15s, border 0.12s;
    }
    .select-all-btn:hover, .clear-all-btn:hover {
      background: #d4eafd;
    }
    .clear-all-btn {
      background: #ffeaea;
      border: 1px solid #f3cccc;
      color: #c63d3d;
      transition: background 0.15s, border 0.12s;
    }
    .clear-all-btn:hover {
      background: #ffdede;
      color: #a40000;
    }
    .filter-checkbox-list {
      display: flex;
      flex-direction: column;
      gap: 0.15em;
      max-height: 170px;
      overflow-y: auto;
      margin-bottom: 0.5em;
    }
    .filter-checkbox-list label {
      font-size: 0.98em;
      white-space: nowrap;
      margin-bottom: 0.1em;
      display: flex;
      align-items: center;
      gap: 0.25em;
    }
    .special-checkbox-list label {
      font-size: 0.98em;
      margin-bottom: 0.3em;
      display: flex;
      align-items: center;
      gap: 0.25em;
      font-weight: normal;
      white-space: nowrap;
    }
    table, #agendaTable { font-size: 0.95rem; }
    canvas {
      height: 100% !important;
      max-width: 100%;
      display: block;
      margin: 2rem auto;
    }
    .truncate-cell, .attachments-cell {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
      cursor: pointer;
      transition: all 0.15s;
    }
    tr.expanded .truncate-cell,
    tr.expanded .attachments-cell {
      white-space: normal !important;
      overflow: visible !important;
      text-overflow: initial !important;
      max-width: 600px !important;
      word-break: break-word;
      background: #f8f8f8;
      z-index: 2;
      position: relative;
    }
    tr.expanded { background: #fafafa !important; }
    .attachments-cell { color: #0073b1; text-decoration: underline; }
    .attachments-list { display: none; margin: 0.4em 0 0 0; padding: 0; }
    tr.expanded .attachments-list { display: block; }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>
  <script>
    fetch("nav.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("nav-placeholder").innerHTML = data;
      });
  </script>

  <h1>Homepage</h1>
  <script>
    document.title = document.querySelector("h1")?.innerText || "AF BoardDocs Dash";
  </script>

  <!-- FILTER BAR -->
  <div class="filter-bar" id="filterBar">
    <div class="filter-group" id="yearFilterGroup">
      <span class="filter-label">Year</span>
      <div class="filter-btn-row">
        <button type="button" class="select-all-btn" data-filter="year">Select All</button>
        <button type="button" class="clear-all-btn" data-filter="year">Clear All</button>
      </div>
      <span class="filter-checkbox-list" id="yearCheckboxList"></span>
    </div>
    <div class="filter-group" id="categoryFilterGroup">
      <span class="filter-label">Category</span>
      <div class="filter-btn-row">
        <button type="button" class="select-all-btn" data-filter="category">Select All</button>
        <button type="button" class="clear-all-btn" data-filter="category">Clear All</button>
      </div>
      <span class="filter-checkbox-list" id="categoryCheckboxList"></span>
    </div>
    <div class="filter-group" id="typeFilterGroup">
      <span class="filter-label">Type</span>
      <div class="filter-btn-row">
        <button type="button" class="select-all-btn" data-filter="type">Select All</button>
        <button type="button" class="clear-all-btn" data-filter="type">Clear All</button>
      </div>
      <span class="filter-checkbox-list" id="typeCheckboxList"></span>
    </div>
    <div class="filter-group" id="specialFilterGroup">
      <span class="filter-label">Special</span>
      <div class="special-checkbox-list">
        <label><input type="checkbox" id="excludeNoVote"> Exclude items without a vote</label>
        <label><input type="checkbox" id="onlyNonUnanimous"> Only show non-unanimous votes</label>
      </div>
    </div>
  </div>

  <table id="agendaTable" class="display" width="100%">
    <thead>
      <tr>
        <th>Year</th>
        <th>Date</th>
        <th>Agenda #</th>
        <th>Title</th>
        <th>Category</th>
        <th>Type</th>
        <th>Recommended Action</th>
        <th>Moved By</th>
        <th>Seconded By</th>
        <th>Vote Result</th>
        <th>Yes</th>
        <th>No</th>
        <th>Abstain</th>
        <th>Attachments</th>
      </tr>
    </thead>
  </table>

  <canvas id="voteChart"></canvas>

<!-- Use the robust, shared normalization logic -->
<script src="js/boarddocs_common.js"></script>
<script>
const chunkedFiles = [
  "data/master_2013to2024_cleaned.json",
  "data/2025_cleaned.json"
];

(async function(){
  await loadMapping();

  let allAgendaItems = [];
  let table;
  let activeYearFilters = [];
  let activeCategoryFilters = [];
  let activeTypeFilters = [];
  let excludeNoVote = false;
  let onlyNonUnanimous = false;

  function renderFilterCheckboxes(values, containerId, activeValues) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    values.forEach(val => {
      const id = containerId + '_' + String(val).replace(/[^a-zA-Z0-9]/g, '');
      container.innerHTML += `
        <label><input type="checkbox" value="${val}" id="${id}" ${activeValues.includes(val) ? 'checked' : ''}>
        ${val}</label>
      `;
    });
  }

  function updateChart(data) {
    const result = { Yes: 0, No: 0, Abstain: 0 };
    data.forEach(row => {
      result.Yes += Number(row.yes_votes) || 0;
      result.No += Number(row.no_votes) || 0;
      result.Abstain += Number(row.abstain_votes) || 0;
    });
    const ctx = document.getElementById('voteChart').getContext('2d');
    if (window.voteChart) window.voteChart.destroy();
    window.voteChart = new Chart(ctx, {
      type: 'pie',
      data: {
        labels: Object.keys(result),
        datasets: [{
          label: 'Total Votes',
          data: Object.values(result),
          backgroundColor: ['#2ecc71', '#e74c3c', '#f1c40f']
        }]
      },
      options: {
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          title: { display: true, text: "Vote Totals (Visible Items)" }
        }
      }
    });
  }

  // --- 1. Load and flatten data ---
  const meetings = [];
  for (let file of chunkedFiles) {
    try {
      const resp = await fetch(file);
      const json = await resp.json();
      meetings.push(...json);
    } catch (e) {
      console.error("Failed to load", file, e);
    }
  }
  const items = [];
  meetings.forEach(meeting => {
    (meeting.agenda_items || []).forEach(item => {
      let yes = 0, no = 0, abstain = 0;
      let moved_by = "", seconded_by = "";
      let vote_result = "";
      if (item.motion_and_voting) {
        const mv = item.motion_and_voting;
        vote_result = mv.vote_result || "";
        moved_by = mv.moved_by || "";
        seconded_by = mv.seconded_by || "";
        if (Array.isArray(mv.votes)) {
          mv.votes.forEach(v => {
            if (!v || !v.vote) return;
            if (v.vote === "Yes") yes++;
            else if (v.vote === "No") no++;
            else if (v.vote === "Abstain") abstain++;
          });
        }
      }
      let attachmentArray = [];
      if (Array.isArray(item.attachments) && item.attachments.length) {
        attachmentArray = item.attachments.map(a =>
          `<a href="${a.url}" target="_blank">${a.filename || a.label || "File"}</a>`
        );
      }
      // Use shared normalization for category and type (always arrays)
      const normCats = normalizeCategories(item.category);
      const normType = normalizeType(item.type);

      items.push({
        year: (meeting.meeting_date || "").slice(0, 4),
        meeting_date: meeting.meeting_date,
        agenda_number: item.number,
        title: item.title,
        category: normCats,
        type: normType,
        recommended_action: item.recommendedAction,
        moved_by: moved_by,
        seconded_by: seconded_by,
        vote_result: vote_result,
        yes_votes: yes,
        no_votes: no,
        abstain_votes: abstain,
        attachment_links: attachmentArray
      });
    });
  });
  allAgendaItems = items;

  // --- 2. Build atomic filter lists (now truly atomic) ---
  const allYears = [...new Set(allAgendaItems.map(i => i.year))]
    .filter(Boolean)
    .sort((a, b) => b.localeCompare(a));
  const allCategories = getUniqueSorted(allAgendaItems.flatMap(i => i.category));
  const allTypes = getUniqueSorted(allAgendaItems.flatMap(i => i.type));

  activeYearFilters = [...allYears];
  activeCategoryFilters = [...allCategories];
  activeTypeFilters = [...allTypes];
  renderFilterCheckboxes(allYears, "yearCheckboxList", activeYearFilters);
  renderFilterCheckboxes(allCategories, "categoryCheckboxList", activeCategoryFilters);
  renderFilterCheckboxes(allTypes, "typeCheckboxList", activeTypeFilters);

  // --- 3. DataTable setup ---
  table = $('#agendaTable').DataTable({
    data: allAgendaItems,
    order: [[0, 'desc']],
    pageLength: 25,
    columns: [
      { data: "year" },
      { data: "meeting_date" },
      { data: "agenda_number" },
      { data: "title" },
      {
        data: "category",
        render: renderArray
      },
      {
        data: "type",
        render: renderArray
      },
      {
        data: "recommended_action",
        render: function (data, type, row, meta) {
          if (!data) return "";
          if (type === 'display') {
            return `<div class="truncate-cell" title="Click row to expand/collapse">${data}</div>`;
          }
          return data;
        }
      },
      { data: "moved_by" },
      { data: "seconded_by" },
      { data: "vote_result" },
      { data: "yes_votes" },
      { data: "no_votes" },
      { data: "abstain_votes" },
      {
        data: "attachment_links",
        orderable: false,
        render: function (data, type, row, meta) {
          if (!data || !data.length) return "";
          if (type === 'display') {
            return `<div class="attachments-cell" title="Click row to expand/collapse">Show Attachments <span style="font-size:1em">📎</span>
              <div class="attachments-list">${data.map(a => `<div>${a}</div>`).join("")}</div>
            </div>`;
          }
          return data.length + " attachment" + (data.length === 1 ? "" : "s");
        }
      }
    ]
  });

  // --- 4. DataTables filter hook (array/tag aware) ---
  $.fn.dataTable.ext.search.push(function(settings, data, dataIndex) {
    const row = table.row(dataIndex).data();
    if (!row) return true;
    // Year filter
    if (activeYearFilters.length && !activeYearFilters.includes(row.year)) return false;
    // Category filter (atomic)
    if (activeCategoryFilters.length && !anyTagMatch(row.category, activeCategoryFilters)) return false;
    // Type filter (atomic)
    if (activeTypeFilters.length && !anyTagMatch(row.type, activeTypeFilters)) return false;
    // Exclude items without a vote
    if (excludeNoVote && !row.vote_result) return false;
    // Only show non-unanimous
    if (onlyNonUnanimous) {
      const yes = Number(row.yes_votes) || 0, no = Number(row.no_votes) || 0, abstain = Number(row.abstain_votes) || 0;
      if (yes && (no === 0 && abstain === 0)) return false;
    }
    return true;
  });

  // --- 5. Listen for filter changes ---
  $(document).on('change', '#yearCheckboxList input[type=checkbox]', function() {
    activeYearFilters = $('#yearCheckboxList input[type=checkbox]:checked').map(function() { return this.value; }).get();
    table.draw();
    updateChart(table.rows({ filter: 'applied' }).data().toArray());
  });
  $(document).on('change', '#categoryCheckboxList input[type=checkbox]', function() {
    activeCategoryFilters = $('#categoryCheckboxList input[type=checkbox]:checked').map(function() { return this.value; }).get();
    table.draw();
    updateChart(table.rows({ filter: 'applied' }).data().toArray());
  });
  $(document).on('change', '#typeCheckboxList input[type=checkbox]', function() {
    activeTypeFilters = $('#typeCheckboxList input[type=checkbox]:checked').map(function() { return this.value; }).get();
    table.draw();
    updateChart(table.rows({ filter: 'applied' }).data().toArray());
  });

  // 6. "Select All" and "Clear All" buttons
  $(document).on('click', '.select-all-btn', function() {
    const type = $(this).data('filter');
    if (type === "year") {
      activeYearFilters = [...allYears];
      renderFilterCheckboxes(allYears, "yearCheckboxList", activeYearFilters);
    } else if (type === "category") {
      activeCategoryFilters = [...allCategories];
      renderFilterCheckboxes(allCategories, "categoryCheckboxList", activeCategoryFilters);
    } else if (type === "type") {
      activeTypeFilters = [...allTypes];
      renderFilterCheckboxes(allTypes, "typeCheckboxList", activeTypeFilters);
    }
    table.draw();
    updateChart(table.rows({ filter: 'applied' }).data().toArray());
  });

  $(document).on('click', '.clear-all-btn', function() {
    const type = $(this).data('filter');
    if (type === "year") {
      activeYearFilters = [];
      renderFilterCheckboxes(allYears, "yearCheckboxList", activeYearFilters);
    } else if (type === "category") {
      activeCategoryFilters = [];
      renderFilterCheckboxes(allCategories, "categoryCheckboxList", activeCategoryFilters);
    } else if (type === "type") {
      activeTypeFilters = [];
      renderFilterCheckboxes(allTypes, "typeCheckboxList", activeTypeFilters);
    }
    table.draw();
    updateChart(table.rows({ filter: 'applied' }).data().toArray());
  });

  // 7. Special filter checkboxes
  $('#excludeNoVote').on('change', function() {
    excludeNoVote = this.checked;
    table.draw();
    updateChart(table.rows({ filter: 'applied' }).data().toArray());
  });
  $('#onlyNonUnanimous').on('change', function() {
    onlyNonUnanimous = this.checked;
    table.draw();
    updateChart(table.rows({ filter: 'applied' }).data().toArray());
  });

  // Row expand/collapse logic
  $('#agendaTable tbody').on('click', 'td', function () {
    var $tr = $(this).closest('tr');
    $tr.toggleClass('expanded');
  });

  // Initial chart
  updateChart(table.rows({ filter: 'applied' }).data().toArray());
  table.on('draw', function() {
    updateChart(table.rows({ filter: 'applied' }).data().toArray());
    $('#agendaTable tbody tr').removeClass('expanded');
  });
})();
</script>

</body>
</html>
