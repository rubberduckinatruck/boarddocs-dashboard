<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AF BoardDocs</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    h1 { font-size: 1.2rem; margin-bottom: 1rem; }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2.5em;
      background: #f8fafd;
      border-radius: 10px;
      border: 1px solid #e2e9f5;
      padding: 1em 1.2em 0.7em 1.2em;
      margin-bottom: 1.7em;
      box-shadow: 0 2px 12px rgba(60,120,200,0.04);
    }
    .filter-group {
      margin-bottom: 0.4em;
    }
    .filter-group label, .filter-group strong {
      margin-right: 1.2em;
      font-size: 0.98em;
    }
    .filter-checkbox-list {
      display: inline-block;
      margin-right: 1em;
      min-width: 160px;
      vertical-align: top;
    }
    .filter-checkbox-list label {
      display: inline-block;
      margin-right: 0.7em;
      margin-bottom: 0.3em;
      white-space: nowrap;
    }
    .select-all-btn {
      margin-left: 0.5em;
      font-size: 0.97em;
      background: #eef5fb;
      border: 1px solid #b5cde7;
      color: #2576b6;
      border-radius: 5px;
      padding: 2px 9px;
      cursor: pointer;
      transition: background 0.15s, border 0.12s;
    }
    .select-all-btn:hover {
      background: #d4eafd;
    }
    table, #agendaTable { font-size: 0.95rem; }
    canvas {
      height: 100% !important;
      max-width: 100%;
      display: block;
      margin: 2rem auto;
    }
    .truncate-cell, .attachments-cell {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 250px;
      cursor: pointer;
      transition: all 0.15s;
    }
    tr.expanded .truncate-cell,
    tr.expanded .attachments-cell {
      white-space: normal !important;
      overflow: visible !important;
      text-overflow: initial !important;
      max-width: 600px !important;
      word-break: break-word;
      background: #f8f8f8;
      z-index: 2;
      position: relative;
    }
    tr.expanded { background: #fafafa !important; }
    .attachments-cell { color: #0073b1; text-decoration: underline; }
    .attachments-list { display: none; margin: 0.4em 0 0 0; padding: 0; }
    tr.expanded .attachments-list { display: block; }
  </style>
</head>
<body>

  <div id="nav-placeholder"></div>
  <script>
    fetch("nav.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("nav-placeholder").innerHTML = data;
      });
  </script>

  <h1>Homepage</h1>
  <script>
    document.title = document.querySelector("h1")?.innerText || "AF BoardDocs Dash";
  </script>

  <!-- FILTER BAR -->
  <div class="filter-bar" id="filterBar">
    <div class="filter-group" id="yearFilterGroup">
      <strong>Year:</strong>
      <button type="button" class="select-all-btn" data-filter="year">Select All</button>
      <span class="filter-checkbox-list" id="yearCheckboxList"></span>
    </div>
    <div class="filter-group" id="categoryFilterGroup">
      <strong>Category:</strong>
      <button type="button" class="select-all-btn" data-filter="category">Select All</button>
      <span class="filter-checkbox-list" id="categoryCheckboxList"></span>
    </div>
  </div>

  <table id="agendaTable" class="display" width="100%">
    <thead>
      <tr>
        <th>Year</th>
        <th>Date</th>
        <th>Agenda #</th>
        <th>Title</th>
        <th>Category</th>
        <th>Type</th>
        <th>Recommended Action</th>
        <th>Moved By</th>
        <th>Seconded By</th>
        <th>Vote Result</th>
        <th>Yes</th>
        <th>No</th>
        <th>Abstain</th>
        <th>Attachments</th>
      </tr>
    </thead>
  </table>

  <canvas id="voteChart"></canvas>

<script>
const chunkedFiles = [
  "data/master_2013to2024_cleaned.json",
  "data/2025_cleaned.json"
];

// --- CATEGORY NORMALIZATION ---
function normalizeCategories(cat) {
  if (!cat) return ["Other"];
  cat = cat.replace(/^\d+\.*\s*-*\s*/g, '').toLowerCase().trim();
  const map = [
    { tag: "Call to Order", regex: /call to order/ },
    { tag: "Pledge of Allegiance", regex: /pledge of allegiance/ },
    { tag: "Information", regex: /information|discussion|presentation|informational/ },
    { tag: "Recognition/Celebration", regex: /recognition|recognize|celebration|presentations? and celebrations?/ },
    { tag: "Call to the Public", regex: /call to the public|public comments?/ },
    { tag: "Approval of Minutes", regex: /approval of minutes|meeting minutes|minutes/ },
    { tag: "Action Items", regex: /action items?/ },
    { tag: "Consent Agenda Items", regex: /consent agenda/ },
    { tag: "Future Agenda Items", regex: /future agenda/ },
    { tag: "Return to Regular Session", regex: /return to regular session|reconvene|resturn to regular session|reconvene regular board meeting|reconvene meeting|reconvene the regular board meeting|reconvene to regular session/ },
    { tag: "Adjournment", regex: /adjourn(ment)?|adjourn excutive session|adjourn exutive session|adjourn excutiv(e)? session/ },
    { tag: "Executive Session", regex: /executive session|executive sesssion|excutive session|exective session/ },
    { tag: "Public Hearing", regex: /public hearing/ },
    { tag: "Recognitions", regex: /recognitions?/ },
    { tag: "Oath of Office/Election of Governing Board Officers", regex: /oath of office|election of governing board officers|nomination|nominations and election|election of governing board officers for/ },
    { tag: "Board Advisory Committee", regex: /advisory committee/ }
  ];
  const tags = [];
  for (let m of map) {
    if (cat.match(m.regex)) tags.push(m.tag);
  }
  if (tags.length === 0) tags.push("Other");
  return [...new Set(tags)];
}

let allAgendaItems = [];
let table; // global for filters

let activeYearFilters = [];
let activeCategoryFilters = [];

function renderFilterCheckboxes(values, containerId, activeValues) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  values.forEach(val => {
    const id = containerId + '_' + val.replace(/[^a-zA-Z0-9]/g, '');
    container.innerHTML += `
      <label><input type="checkbox" value="${val}" id="${id}" ${activeValues.includes(val) ? 'checked' : ''}>
      ${val}</label>
    `;
  });
}

function getUniqueSorted(arr) {
  return [...new Set(arr)].filter(Boolean).sort();
}

function updateTableFilter() {
  table.draw();
  updateChart(table.rows({ filter: 'applied' }).data().toArray());
}

function updateChart(data) {
  const result = { Yes: 0, No: 0, Abstain: 0 };
  data.forEach(row => {
    result.Yes += Number(row.yes_votes) || 0;
    result.No += Number(row.no_votes) || 0;
    result.Abstain += Number(row.abstain_votes) || 0;
  });
  const ctx = document.getElementById('voteChart').getContext('2d');
  if (window.voteChart) window.voteChart.destroy();
  window.voteChart = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: Object.keys(result),
      datasets: [{
        label: 'Total Votes',
        data: Object.values(result),
        backgroundColor: ['#2ecc71', '#e74c3c', '#f1c40f']
      }]
    },
    options: {
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        title: { display: true, text: "Vote Totals (Visible Items)" }
      }
    }
  });
}

(async function(){
  // 1. Load and flatten data
  const meetings = [];
  for (let file of chunkedFiles) {
    try {
      const resp = await fetch(file);
      const json = await resp.json();
      meetings.push(...json);
    } catch (e) {
      console.error("Failed to load", file, e);
    }
  }
  const items = [];
  meetings.forEach(meeting => {
    (meeting.agenda_items || []).forEach(item => {
      let yes = 0, no = 0, abstain = 0;
      let moved_by = "", seconded_by = "";
      let vote_result = "";
      if (item.motion_and_voting) {
        const mv = item.motion_and_voting;
        vote_result = mv.vote_result || "";
        moved_by = mv.moved_by || "";
        seconded_by = mv.seconded_by || "";
        if (Array.isArray(mv.votes)) {
          mv.votes.forEach(v => {
            if (!v || !v.vote) return;
            if (v.vote === "Yes") yes++;
            else if (v.vote === "No") no++;
            else if (v.vote === "Abstain") abstain++;
          });
        }
      }
      let attachmentArray = [];
      if (Array.isArray(item.attachments) && item.attachments.length) {
        attachmentArray = item.attachments.map(a =>
          `<a href="${a.url}" target="_blank">${a.filename || a.label || "File"}</a>`
        );
      }
      const normCats = normalizeCategories(item.category);
      items.push({
        year: (meeting.meeting_date || "").slice(0, 4),
        meeting_date: meeting.meeting_date,
        agenda_number: item.number,
        title: item.title,
        category: normCats,
        type: item.type,
        recommended_action: item.recommendedAction,
        moved_by: moved_by,
        seconded_by: seconded_by,
        vote_result: vote_result,
        yes_votes: yes,
        no_votes: no,
        abstain_votes: abstain,
        attachment_links: attachmentArray
      });
    });
  });
  allAgendaItems = items;

  // 2. Build filter lists
  const allYears = getUniqueSorted(allAgendaItems.map(i => i.year));
  const allCategories = getUniqueSorted(allAgendaItems.flatMap(i => Array.isArray(i.category) ? i.category : [i.category]));
  activeYearFilters = [...allYears];
  activeCategoryFilters = [...allCategories];
  renderFilterCheckboxes(allYears, "yearCheckboxList", activeYearFilters);
  renderFilterCheckboxes(allCategories, "categoryCheckboxList", activeCategoryFilters);

  // 3. DataTable setup (all columns sortable)
  table = $('#agendaTable').DataTable({
    data: allAgendaItems,
    order: [[0, 'desc']],
    columns: [
      { data: "year" },
      { data: "meeting_date" },
      { data: "agenda_number" },
      { data: "title" },
      {
        data: "category",
        render: cats => Array.isArray(cats) ? cats.join(", ") : cats
      },
      { data: "type" },
      {
        data: "recommended_action",
        render: function (data, type, row, meta) {
          if (!data) return "";
          if (type === 'display') {
            return `<div class="truncate-cell" title="Click row to expand/collapse">${data}</div>`;
          }
          return data;
        }
      },
      { data: "moved_by" },
      { data: "seconded_by" },
      { data: "vote_result" },
      { data: "yes_votes" },
      { data: "no_votes" },
      { data: "abstain_votes" },
      {
        data: "attachment_links",
        orderable: false,
        render: function (data, type, row, meta) {
          if (!data || !data.length) return "";
          if (type === 'display') {
            return `<div class="attachments-cell" title="Click row to expand/collapse">Show Attachments <span style="font-size:1em">📎</span>
              <div class="attachments-list">${data.map(a => `<div>${a}</div>`).join("")}</div>
            </div>`;
          }
          return data.length + " attachment" + (data.length === 1 ? "" : "s");
        }
      }
    ]
  });

  // 4. DataTables filter hook
  $.fn.dataTable.ext.search.push(function(settings, data, dataIndex) {
    const row = table.row(dataIndex).data();
    if (!row) return true;
    // Year filter
    if (activeYearFilters.length && !activeYearFilters.includes(row.year)) return false;
    // Category filter
    const rowCats = Array.isArray(row.category) ? row.category : [row.category];
    if (activeCategoryFilters.length && !rowCats.some(cat => activeCategoryFilters.includes(cat))) return false;
    return true;
  });

  // 5. Listen for year/category filter changes
  $(document).on('change', '#yearCheckboxList input[type=checkbox]', function() {
    activeYearFilters = $('#yearCheckboxList input[type=checkbox]:checked').map(function() { return this.value; }).get();
    updateTableFilter();
  });
  $(document).on('change', '#categoryCheckboxList input[type=checkbox]', function() {
    activeCategoryFilters = $('#categoryCheckboxList input[type=checkbox]:checked').map(function() { return this.value; }).get();
    updateTableFilter();
  });

  // 6. "Select All" buttons
  $(document).on('click', '.select-all-btn', function() {
    const type = $(this).data('filter');
    if (type === "year") {
      activeYearFilters = [...allYears];
      renderFilterCheckboxes(allYears, "yearCheckboxList", activeYearFilters);
    } else if (type === "category") {
      activeCategoryFilters = [...allCategories];
      renderFilterCheckboxes(allCategories, "categoryCheckboxList", activeCategoryFilters);
    }
    updateTableFilter();
  });

  // Row expand/collapse logic
  $('#agendaTable tbody').on('click', 'td', function () {
    var $tr = $(this).closest('tr');
    $tr.toggleClass('expanded');
  });

  // Initial chart
  updateChart(table.rows({ filter: 'applied' }).data().toArray());
  table.on('draw', function() {
    updateChart(table.rows({ filter: 'applied' }).data().toArray());
    $('#agendaTable tbody tr').removeClass('expanded');
  });
})();
</script>

</body>
</html>
