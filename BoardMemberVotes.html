<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AF BoardDocs Dash – Categories</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <style>
    body { font-family: sans-serif; margin: 0; background: #fafbfc; }
    #layout {
      display: flex;
      min-height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 0;
    }
    #sidebar {
      flex: 0 0 250px;
      background: #f5f7fa;
      padding: 1.7rem 1.4rem 1.2rem 1.7rem;
      border-radius: 1.2rem;
      margin-right: 2.5rem;
      box-shadow: 0 0 8px #e3e9ef;
      min-width: 220px;
      max-width: 320px;
    }
    #main {
      flex: 1;
      min-width: 0;
    }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    .filters-section {
      margin-bottom: 1.1em;
    }
    .filter-group-title {
      display: block;
      font-size: 1.02em;
      font-weight: 600;
      margin-bottom: 0.3em;
    }
    .clear-link {
      font-size: 0.93em;
      font-weight: 400;
      color: #1c59b4;
      text-decoration: underline;
      margin-left: 0.5em;
      cursor: pointer;
      opacity: 0.85;
    }
    .clear-link:hover { color: #1976d2; }
    #clearAllFiltersBtn {
      margin-top: 1.2em; width:90%;
      background:#f8dada;
      border:none; padding:0.6em;
      border-radius:0.5em; font-size:1em;
      cursor:pointer;
    }
    #clearAllFiltersBtn:hover { background: #ffeaea; }
    table { width: 100%; margin-top: 2rem; border-collapse: collapse; font-size: 0.96rem; }
    th, td { padding: 0.5rem; text-align: left; border: 1px solid #ddd; }
    th { background-color: #f4f4f4; }
    .filter-list {
      max-height: 140px;
      overflow-y: auto;
      background: #fff;
      border-radius: 0.3em;
      padding: 0.3em 0.3em 0.2em 0.6em;
      border: 1px solid #e3e9ef;
    }
    .filter-list label {
      display: block;
      margin-bottom: 0.2em;
      font-weight: normal;
      font-size: 0.97em;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>
  <script>
    fetch("nav.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("nav-placeholder").innerHTML = data;
      });
  </script>

  <div id="layout">
    <div id="sidebar">
      <h2 style="font-size:1.25em;margin:0 0 1em 0;">Filters</h2>
      <div class="filters-section" id="yearFilterSection">
        <span class="filter-group-title">Year <span class="clear-link" id="clearYear">Clear</span></span>
        <div class="filter-list" id="yearFilterList"></div>
      </div>
      <div class="filters-section" id="tagFilterSection">
        <span class="filter-group-title">Tag <span class="clear-link" id="clearTag">Clear</span></span>
        <div class="filter-list" id="tagFilterList"></div>
      </div>
      <div class="filters-section" id="categoryFilterSection">
        <span class="filter-group-title">Category <span class="clear-link" id="clearCategory">Clear</span></span>
        <div class="filter-list" id="categoryFilterList"></div>
      </div>
      <button id="clearAllFiltersBtn">Clear All Filters</button>
    </div>

    <div id="main">
      <h1>Agenda Items</h1>
      <table id="categoriesTable">
        <thead>
          <tr>
            <th>Meeting Date</th>
            <th>Category</th>
            <th>Title</th>
            <th>Tags</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

<script>
const chunkedFiles = [
  "data/master_2013to2024_cleaned.json",
  "data/2025_cleaned.json"
];
let allMeetings = [];
const filterState = {
  years: [],
  tags: [],
  categories: []
};

function getAllAgendaItems(meetings) {
  // Flatten agenda items, each with parent meeting_date
  return meetings.flatMap(m =>
    (m.agenda_items || []).map(item => ({
      ...item,
      meeting_date: m.meeting_date
    }))
  );
}

function populateSidebarFilters(meetings) {
  // YEARS
  const years = new Set();
  meetings.forEach(m => {
    const y = (m.meeting_date || '').slice(0,4);
    if (/^\d{4}$/.test(y)) years.add(y);
  });
  $('#yearFilterList').html(
    Array.from(years).sort((a, b) => b - a).map(year =>
      `<label><input type="checkbox" name="yearFilter" value="${year}"> ${year}</label>`
    ).join('')
  );

  // TAGS
  const agendaItems = getAllAgendaItems(meetings);
  const tags = new Set();
  agendaItems.forEach(item => {
    let theseTags = item.tags || [];
    if (typeof theseTags === "string") theseTags = theseTags.split(",").map(t=>t.trim());
    theseTags.forEach(t => { if(t) tags.add(t); });
  });
  $('#tagFilterList').html(
    Array.from(tags).sort().map(tag =>
      `<label><input type="checkbox" name="tagFilter" value="${tag}"> ${tag}</label>`
    ).join('')
  );

  // CATEGORIES
  const cats = new Set();
  agendaItems.forEach(item => {
    if (item.category) cats.add(item.category.trim());
  });
  $('#categoryFilterList').html(
    Array.from(cats).sort().map(cat =>
      `<label><input type="checkbox" name="categoryFilter" value="${cat}"> ${cat}</label>`
    ).join('')
  );
}

function setupSidebarEvents(applyAllFilters) {
  // Year
  $('#yearFilterList').on('change', 'input[name="yearFilter"]', function() {
    filterState.years = $('#yearFilterList input:checked').map(function(){return this.value;}).get();
    applyAllFilters();
  });
  $('#clearYear').on('click', function() {
    filterState.years = [];
    $('#yearFilterList input').prop('checked', false);
    applyAllFilters();
  });

  // Tag
  $('#tagFilterList').on('change', 'input[name="tagFilter"]', function() {
    filterState.tags = $('#tagFilterList input:checked').map(function(){return this.value;}).get();
    applyAllFilters();
  });
  $('#clearTag').on('click', function() {
    filterState.tags = [];
    $('#tagFilterList input').prop('checked', false);
    applyAllFilters();
  });

  // Category
  $('#categoryFilterList').on('change', 'input[name="categoryFilter"]', function() {
    filterState.categories = $('#categoryFilterList input:checked').map(function(){return this.value;}).get();
    applyAllFilters();
  });
  $('#clearCategory').on('click', function() {
    filterState.categories = [];
    $('#categoryFilterList input').prop('checked', false);
    applyAllFilters();
  });

  // Clear all
  $('#clearAllFiltersBtn').on('click', function() {
    filterState.years = [];
    filterState.tags = [];
    filterState.categories = [];
    $('#yearFilterList input, #tagFilterList input, #categoryFilterList input').prop('checked', false);
    applyAllFilters();
  });
}

function getFilteredItems(meetings) {
  let items = getAllAgendaItems(meetings);

  // Years (if any checked)
  if (filterState.years.length) {
    items = items.filter(i => i.meeting_date && filterState.years.some(y => i.meeting_date.startsWith(y)));
  }
  // Tags (must match at least one checked tag, or skip if none checked)
  if (filterState.tags.length) {
    items = items.filter(i => {
      let theseTags = i.tags || [];
      if (typeof theseTags === "string") theseTags = theseTags.split(",").map(t=>t.trim());
      return theseTags.some(t => filterState.tags.includes(t));
    });
  }
  // Categories (must match at least one checked cat, or skip if none checked)
  if (filterState.categories.length) {
    items = items.filter(i => i.category && filterState.categories.includes(i.category.trim()));
  }
  return items;
}

function renderCategoriesTable(meetings) {
  const filteredItems = getFilteredItems(meetings);
  const tableData = filteredItems.map(item => [
    item.meeting_date || "",
    item.category || "",
    item.title || "[Untitled]",
    (typeof item.tags === "string" ? item.tags : (item.tags || []).join(", ")) || ""
  ]);

  // Destroy/recreate DataTable for instant filtering
  if ($.fn.DataTable.isDataTable('#categoriesTable')) {
    const dt = $('#categoriesTable').DataTable();
    dt.clear().rows.add(tableData).draw();
  } else {
    $('#categoriesTable').DataTable({
      data: tableData,
      columns: [
        { title: "Meeting Date" },
        { title: "Category" },
        { title: "Title" },
        { title: "Tags" }
      ],
      paging: true,
      pageLength: 25,
      searching: false,
      info: false,
      order: [[0,"desc"]],
      autoWidth: false
    });
  }
}

// Load and initialize
(async function() {
  allMeetings = [];
  for (let file of chunkedFiles) {
    try {
      const resp = await fetch(file);
      const json = await resp.json();
      allMeetings.push(...json);
    } catch (e) {
      console.error("Failed to load", file, e);
    }
  }

  populateSidebarFilters(allMeetings);
  setupSidebarEvents(() => renderCategoriesTable(allMeetings));
  renderCategoriesTable(allMeetings);
})();
</script>
</body>
</html>
