<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AF BoardDocs Dash – Categories</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css" />
  <style>
    body { font-family: sans-serif; margin: 0; background: #fafbfc; }
    #layout {
      display: flex;
      min-height: 100vh;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 0;
    }
    #sidebar {
      flex: 0 0 250px;
      background: #f5f7fa;
      padding: 1.7rem 1.4rem 1.2rem 1.7rem;
      border-radius: 1.2rem;
      margin-right: 2.5rem;
      box-shadow: 0 0 8px #e3e9ef;
      min-width: 220px;
      max-width: 320px;
    }
    #main {
      flex: 1;
      min-width: 0;
    }
    h1 { font-size: 2rem; margin-bottom: 1rem; }
    .filters-section {
      margin-bottom: 1.1em;
    }
    .filter-group-title {
      display: block;
      font-size: 1.02em;
      font-weight: 600;
      margin-bottom: 0.3em;
    }
    .clear-link {
      font-size: 0.93em;
      font-weight: 400;
      color: #1c59b4;
      text-decoration: underline;
      margin-left: 0.5em;
      cursor: pointer;
      opacity: 0.85;
    }
    .clear-link:hover { color: #1976d2; }
    #clearAllFiltersBtn {
      margin-top: 1.2em; width:90%;
      background:#f8dada;
      border:none; padding:0.6em;
      border-radius:0.5em; font-size:1em;
      cursor:pointer;
    }
    #clearAllFiltersBtn:hover { background: #ffeaea; }
    table { width: 100%; margin-top: 2rem; border-collapse: collapse; font-size: 0.96rem; }
    th, td { padding: 0.5rem; text-align: left; border: 1px solid #ddd; }
    th { background-color: #f4f4f4; }
    .category-header {
      font-size: 1.25em;
      margin-top: 2em;
      color: #1c59b4;
    }
    .item-list { margin-bottom: 2em; }
    .item-row { padding-left: 1em; font-size: 1em; margin-bottom: 0.5em; }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>
  <script>
    fetch("nav.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("nav-placeholder").innerHTML = data;
      });
  </script>

  <div id="layout">
    <div id="sidebar">
      <h2 style="font-size:1.25em;margin:0 0 1em 0;">Filters</h2>
      <div class="filters-section" id="yearFilterSection">
        <span class="filter-group-title">Year <span class="clear-link" id="clearYear">Clear</span></span>
        <div id="yearFilterList"></div>
      </div>
      <div class="filters-section" id="tagFilterSection">
        <span class="filter-group-title">Tag <span class="clear-link" id="clearTag">Clear</span></span>
        <div id="tagFilterList"></div>
      </div>
      <div class="filters-section" id="categoryFilterSection">
        <span class="filter-group-title">Category <span class="clear-link" id="clearCategory">Clear</span></span>
        <div id="categoryFilterList"></div>
      </div>
      <button id="clearAllFiltersBtn">Clear All Filters</button>
    </div>

    <div id="main">
      <h1>Agenda Items by Category</h1>
      <div id="categoriesOutput">
        <!-- Dynamic category tables/lists will go here -->
      </div>
    </div>
  </div>

<script>
const chunkedFiles = [
  "data/master_2013to2024_cleaned.json",
  "data/2025_cleaned.json"
];
let allMeetings = [];
const filterState = {
  year: null,
  tag: null,
  category: null
};

function getAllAgendaItems(meetings) {
  // Flattens all agenda items from all meetings, adding meeting_date for each
  return meetings.flatMap(m =>
    (m.agenda_items || []).map(item => ({
      ...item,
      meeting_date: m.meeting_date
    }))
  );
}

function populateSidebarFilters(meetings) {
  // YEAR
  const years = new Set();
  meetings.forEach(m => {
    const y = (m.meeting_date || '').slice(0,4);
    if (/^\d{4}$/.test(y)) years.add(y);
  });
  $('#yearFilterList').html(
    Array.from(years).sort((a, b) => b - a).map(year =>
      `<div><label><input type="radio" name="yearFilter" value="${year}"> ${year}</label></div>`
    ).join('')
  );

  // TAG
  const agendaItems = getAllAgendaItems(meetings);
  const tags = new Set();
  agendaItems.forEach(item => {
    let theseTags = item.tags || [];
    if (typeof theseTags === "string") theseTags = theseTags.split(",").map(t=>t.trim());
    theseTags.forEach(t => { if(t) tags.add(t); });
  });
  $('#tagFilterList').html(
    Array.from(tags).sort().map(tag =>
      `<div><label><input type="radio" name="tagFilter" value="${tag}"> ${tag}</label></div>`
    ).join('')
  );

  // CATEGORY
  const cats = new Set();
  agendaItems.forEach(item => {
    if (item.category) cats.add(item.category.trim());
  });
  $('#categoryFilterList').html(
    Array.from(cats).sort().map(cat =>
      `<div><label><input type="radio" name="categoryFilter" value="${cat}"> ${cat}</label></div>`
    ).join('')
  );
}

function setupSidebarEvents(applyAllFilters) {
  // Year radio
  $('#yearFilterList').on('change', 'input[name="yearFilter"]', function() {
    filterState.year = this.checked ? this.value : null;
    applyAllFilters();
  });
  $('#clearYear').on('click', function() {
    filterState.year = null;
    $('#yearFilterList input').prop('checked', false);
    applyAllFilters();
  });

  // Tag radio
  $('#tagFilterList').on('change', 'input[name="tagFilter"]', function() {
    filterState.tag = this.checked ? this.value : null;
    applyAllFilters();
  });
  $('#clearTag').on('click', function() {
    filterState.tag = null;
    $('#tagFilterList input').prop('checked', false);
    applyAllFilters();
  });

  // Category radio
  $('#categoryFilterList').on('change', 'input[name="categoryFilter"]', function() {
    filterState.category = this.checked ? this.value : null;
    applyAllFilters();
  });
  $('#clearCategory').on('click', function() {
    filterState.category = null;
    $('#categoryFilterList input').prop('checked', false);
    applyAllFilters();
  });

  // Clear all
  $('#clearAllFiltersBtn').on('click', function() {
    filterState.year = null; filterState.tag = null; filterState.category = null;
    $('#yearFilterList input, #tagFilterList input, #categoryFilterList input').prop('checked', false);
    applyAllFilters();
  });
}

// Filtering logic for agenda items
function getFilteredItems(meetings) {
  let items = getAllAgendaItems(meetings);

  if (filterState.year) {
    items = items.filter(i => i.meeting_date && i.meeting_date.startsWith(filterState.year));
  }
  if (filterState.tag) {
    items = items.filter(i => {
      let theseTags = i.tags || [];
      if (typeof theseTags === "string") theseTags = theseTags.split(",").map(t=>t.trim());
      return theseTags.includes(filterState.tag);
    });
  }
  if (filterState.category) {
    items = items.filter(i => i.category && i.category.trim() === filterState.category);
  }
  return items;
}

function renderCategoriesTable(meetings) {
  const filteredItems = getFilteredItems(meetings);
  const itemsByCategory = {};
  filteredItems.forEach(item => {
    const cat = item.category ? item.category.trim() : "(Uncategorized)";
    if (!itemsByCategory[cat]) itemsByCategory[cat] = [];
    itemsByCategory[cat].push(item);
  });

  let html = '';
  Object.keys(itemsByCategory).sort().forEach(cat => {
    html += `<div class="category-header">${cat}</div><div class="item-list">`;
    itemsByCategory[cat].forEach(item => {
      html += `<div class="item-row">${item.title || '[Untitled]'} <span style="color:#888;font-size:0.95em;">(${item.meeting_date || ''})</span></div>`;
    });
    html += `</div>`;
  });

  if (!html) html = '<div style="color:#b00;">No items match these filters.</div>';
  $('#categoriesOutput').html(html);
}

// Load and initialize
(async function() {
  allMeetings = [];
  for (let file of chunkedFiles) {
    try {
      const resp = await fetch(file);
      const json = await resp.json();
      allMeetings.push(...json);
    } catch (e) {
      console.error("Failed to load", file, e);
    }
  }

  populateSidebarFilters(allMeetings);
  setupSidebarEvents(() => renderCategoriesTable(allMeetings));
  renderCategoriesTable(allMeetings);
})();
</script>
</body>
</html>
