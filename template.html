  <!-- DO NOT EDIT: Data normalization utilities (always include before your main logic) -->
  <script src="data-normalization.js"></script>

  <!-- DO NOT EDIT: Shared Data Loading/Flattening/Normalization Logic -->
  <script>
    Promise.all([
      fetch("data/master_2013to2024_cleaned.json").then(res => res.json()),
      fetch("data/2025_cleaned.json").then(res => res.json())
    ]).then(([data1, data2]) => {
      let allAgendaItems = [];
      const allMeetings = Array.isArray(data1) && Array.isArray(data2)
        ? [...data1, ...data2]
        : (Array.isArray(data1) ? data1 : []).concat(Array.isArray(data2) ? data2 : []);
      for (const meeting of allMeetings) {
        if (Array.isArray(meeting.agenda_items)) {
          for (const item of meeting.agenda_items) {
            allAgendaItems.push({
              ...item,
              meeting_date: meeting.meeting_date
            });
          }
        }
      }
      // DO NOT EDIT: Normalize category and type ONCE for the entire site
      allAgendaItems = allAgendaItems.map(item => ({
        ...item,
        category: Array.isArray(item.category)
          ? item.category
          : normalizeCategories(item.category),
        type: normalizeType(item.type)
      }));

      // -----------------------------------------------------------------------

      //   • Add event listeners for sidebar filters (like #typeFilter)
      //   • Write the logic that decides what data is shown, how it is grouped, etc.
      //

      // DO NOT add filter controls to the main content area!

      //   });

      //     // Your page-specific filter/apply logic here
      //   });
      //
      //   // Render tables, charts, etc. based on filtered allAgendaItems
      // -----------------------------------------------------------------------
    });
  </script>
