<!-- sidebar-categories.html -->
<div id="sidebar">
  <h2 style="font-size:1.25em; margin:0 0 1em 0;">Filters</h2>

  <div class="filters-section" id="yearFilterSection">
    <span class="filter-group-title">
      Year <span class="clear-link" id="clearYear">Clear</span>
    </span>
    <div id="yearFilterList"></div>
  </div>

  <div class="filters-section" id="tagFilterSection">
    <span class="filter-group-title">
      Tag <span class="clear-link" id="clearTag">Clear</span>
    </span>
    <div id="tagFilterList"></div>
  </div>

  <div class="filters-section" id="categoryFilterSection">
    <span class="filter-group-title">
      Category <span class="clear-link" id="clearCategory">Clear</span>
    </span>
    <div id="categoryFilterList"></div>
  </div>

  <button id="clearAllFiltersBtn" style="margin-top:1.2em; width:90%;">Clear All Filters</button>

  <div style="margin-top:2.3em; font-size:0.99em; color:#666;">
    <b>How to Use:</b>
    <ul style="margin:0.7em 0 0 1em; padding:0; font-size:0.98em; line-height:1.6;">
      <li>Select any combination of filters to narrow the agenda data.</li>
      <li>Use the <span style="color:#0074d9;">Clear</span> links to reset a single group, or <b>Clear All Filters</b> to reset everything.</li>
    </ul>
  </div>
</div>
